<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedGrayFox Studio | Desarrollo</title>
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    
    <style>
        /* Variables de color */
        :root {
            --red-fox: #ff2a4b;
            --red-glow: rgba(255, 42, 75, 0.4);
            --silver-metal: #a3a8b5;
            --bg-dark: #06080e;
            --panel-bg: rgba(12, 16, 26, 0.75);
            --panel-border: rgba(163, 168, 181, 0.2);
        }

        /* Configuración global de pantalla */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% 50%, rgba(255, 42, 75, 0.15) 0%, transparent 60%),
                url('../images/dbgp1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* Encabezado superior */
        header {
            height: 70px;
            background: rgba(8, 10, 16, 0.95);
            border-bottom: 2px solid var(--red-fox);
            box-shadow: 0 0 15px var(--red-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .brand h1 {
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand h1 a {
            color: #ffffff;
            text-decoration: none;
        }

        .brand h1 span {
            color: var(--red-fox);
        }

        /* Selector de Idioma (ES / EN) */
        .lang-switch button {
            background: transparent;
            border: 1px solid var(--silver-metal);
            color: #fff;
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }
