<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedGrayFox Studio | Desarrollo</title>

    <style>
        /* Variables de color */
        :root {
            --red-fox: #ff2a4b;
            --red-glow: rgba(255, 42, 75, 0.4);
            --silver-metal: #a3a8b5;
            --bg-dark: #06080e;
            --panel-bg: rgba(12, 16, 26, 0.75);
            --panel-border: rgba(163, 168, 181, 0.2);
        }

        /* Configuración global de pantalla */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% 50%, rgba(255, 42, 75, 0.15) 0%, transparent 60%),
                url('../images/dbgp1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* Encabezado superior */
        header {
            height: 70px;
            background: rgba(8, 10, 16, 0.95);
            border-bottom: 2px solid var(--red-fox);
            box-shadow: 0 0 15px var(--red-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .brand h1 {
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand h1 a {
            color: #ffffff;
            text-decoration: none;
        }

        .brand h1 span {
            color: var(--red-fox);
        }

        /* Selector de Idioma (ES / EN) */
        .lang-switch button {
            background: transparent;
            border: 1px solid var(--silver-metal);
            color: #fff;
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .lang-switch button:hover {
            border-color: var(--red-fox);
            color: var(--red-fox);
            box-shadow: 0 0 8px var(--red-glow);
        }

        /* Contenedor Flexbox de 2 Columnas */
        .main-container {
            display: flex;
            height: calc(100vh - 70px);
            padding: 20px;
            box-sizing: border-box;
        }

        /* COLUMNA IZQUIERDA: Avances del Proyecto */
        .left-col {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px 0 0 8px;
            padding: 25px;
            overflow-y: auto;
            backdrop-filter: blur(0px);
            margin-right: 15px;
            border-right: 2px solid var(--red-fox);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8);
        }

        /* COLUMNA DERECHA: Comentarios de Disqus */
        .right-col {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 0 8px 8px 0;
            padding: 25px;
            overflow-y: auto;
            backdrop-filter: blur(0px);
            margin-left: 15px;
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.8);
        }

        /* Publicaciones en la columna izquierda */
        .entry {
            background: rgba(20, 26, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .entry-date {
            color: var(--red-fox);
            font-size: 0.85rem;
            font-weight: bold;
        }

        .entry-title {
            margin: 8px 0 12px 0;
            color: #fff;
        }

        .entry img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
            margin-top: 10px;
        }

        .entry audio {
            width: 100%;
            margin-top: 12px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--red-fox);
            border-radius: 4px;
        }

          /* Aviso de girar pantalla */
  .rotate-notice {
    display: none !important; /* Lo oculta en PC */
    text-align: center !important;
    width: 100% !important;
    margin: 10px auto !important;
    font-size: 0.8rem;
    color: #a3a8b5;
  }

  /* Solo se muestra centrado en móviles verticales */
  @media (max-width: 768px) and (orientation: portrait) {
    .rotate-notice {
      display: block !important;
    }
  }
    

            /* Corrección para pantalla vertical en móviles */
        @media screen and (orientation: portrait) and (max-width: 768px) {
            html {
                height: auto !important;
                overflow-x: hidden !important;
                overflow-y: auto !important;
            }

            body {
                height: auto !important;
                min-height: 100% !important;
                overflow-x: hidden !important;
                overflow-y: auto !important;
                background-image: none !important;
            }

            /* Capa de fondo estática que no rompe el scroll ni el refresh */
            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: -1;
                background-color: var(--bg-dark);
                background-image:
                    radial-gradient(circle at 50% 50%, rgba(255, 42, 75, 0.15) 0%, transparent 60%),
                    url('../images/dbgp1.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }

            .main-container {
                display: block !important;
                height: auto !important;
                padding: 10px !important;
                overflow: visible !important;
            }

            .left-col,
            .right-col {
                width: 100% !important;
                height: auto !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                margin-bottom: 20px !important;
                border-radius: 8px !important;
                box-sizing: border-box !important;
                overflow: visible !important;
            }
        }



        
    </style>
</head>

    <!-- CAMBIO DE IDIOMA -->
    <script>
  function switchLanguage(lang) {
    document.documentElement.lang = lang;

    document.querySelectorAll('.lang').forEach(el => {
      el.innerText = el.getAttribute(`data-${lang}`);
    });

    if (typeof renderDevlog === 'function') {
      renderDevlog();
    }
  }
</script>

<script>
    let devlogData = [];
  function renderDevlog() {
      const container = document.getElementById('devlog-container');
      if (!container || !devlogData.length) return;
    // Lee el idioma actual de la página (<html lang="es"> o "en")
      const currentLang = document.documentElement.lang || 'es';
    container.innerHTML = devlogData.map(post => {
        // Obtiene el contenido en el idioma activo (o 'es' por defecto)
        const content = post[currentLang] || post['es'] || {};
      return `
      <article class="entry" style="margin-bottom: 20px;">
      ${post.imagen ? `<img src="../${post.imagen}" alt="Devlog Image" style="display: block; width: 100%; max-width: 500px; height: auto; margin-bottom: 10px;">` : ''}
      <span class="entry-date">${post.fecha}</span>
      <h3 class="entry-title">${content.titulo || ''}</h3>
      <p>${content.resumen || ''}</p>
      </article>
      `;
    }).join('');
  }
  // Carga el JSON fresco evitando la memoria caché
    fetch('../devlog.json?v=' + new Date().getTime())
        .then(response => response.json())
        .then(data => {
            devlogData = data;
            renderDevlog();
        })
        .catch(err => console.error('Error cargando devlog:', err));
</script>

<script>  const studioVideo = document.getElementById('studio-intro');

      studioVideo.play();        // Inicia el video
    } else {
      studioVideo.pause();       // Lo pausa si le vuelven a dar clic
    }
  });
